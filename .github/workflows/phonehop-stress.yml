name: PhoneHop network tests (stress)

# Re-runs the PhoneHop network tests many times in a row to catch flaky races.
# Runs when this file changes, or by hand (Actions → this workflow → Run workflow).
on:
  push:
    paths:
      - .github/workflows/phonehop-stress.yml
  workflow_dispatch:
    inputs:
      runs:
        description: Back-to-back runs per runner
        default: "10"

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core and phone-to-phone tests, again and again
        env:
          RUNS: ${{ inputs.runs || '10' }}
        run: |
          for i in $(seq 1 "$RUNS"); do
            echo "::group::Run $i of $RUNS"
            ./gradlew :core:test :app:testDebugUnitTest --tests '*PhoneToPhoneTest' --rerun-tasks \
              || { echo "::endgroup::"; echo "::error::Failed on run $i of $RUNS"; exit 1; }
            echo "::endgroup::"
          done
          echo "All $RUNS runs passed"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-reports-${{ matrix.runner }}
          path: |
            core/build/reports
            app/build/reports
