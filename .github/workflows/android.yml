name: Android

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key. Add the secrets described in README.md;
      # without them the APK is signed with a throw-away debug key.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONEHOP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "PHONEHOP_STOREFILE=release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build
        env:
          PHONEHOP_STOREPASSWORD: ${{ secrets.PHONEHOP_STORE_PASSWORD }}
          PHONEHOP_KEYALIAS: ${{ secrets.PHONEHOP_KEY_ALIAS }}
          PHONEHOP_KEYPASSWORD: ${{ secrets.PHONEHOP_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneHop-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports
            app/build/reports
